name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: write  # needed to push to gh-pages branch

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inject the Cognito config into the HTML before deploying.
      # API_URL is NOT injected: it lives hardcoded in frontend/index.html
      # (it is public in the served HTML anyway; Cognito is what protects the API).
      - name: Inject Cognito config
        run: |
          if [ -z "${{ secrets.COGNITO_CLIENT_ID }}" ] || [ -z "${{ secrets.COGNITO_REGION }}" ]; then
            echo "❌ COGNITO_CLIENT_ID / COGNITO_REGION secrets are not set — deploying without them would break login."
            exit 1
          fi
          sed -i "s|__COGNITO_CLIENT_ID__|${{ secrets.COGNITO_CLIENT_ID }}|g" frontend/index.html
          sed -i "s|__COGNITO_REGION__|${{ secrets.COGNITO_REGION }}|g" frontend/index.html
          if grep -q "__COGNITO_CLIENT_ID__\|__COGNITO_REGION__" frontend/index.html; then
            echo "❌ Placeholder replacement failed."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          # Keep CNAME file if you have a custom domain
          cname: ${{ vars.CUSTOM_DOMAIN }}
